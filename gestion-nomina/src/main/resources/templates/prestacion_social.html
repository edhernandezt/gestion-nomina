<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Prestaciones Sociales</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container-empleado">
    <h4 class="titulo-reporte">Reporte de Prestaciones Sociales</h4>

    <form th:action="@{/prestaciones}" method="get" class="form-filtro">
        <label for="fechaInicio">Desde:</label>
        <input type="date" id="fechaInicio" name="fechaInicio" th:value="${fechaInicio}">

        <label for="fechaFin">Hasta:</label>
        <input type="date" id="fechaFin" name="fechaFin" th:value="${fechaFin}">

        <label for="keyword">Empleado:</label>
        <input type="text" id="keyword" name="keyword" placeholder="Nombre o apellido" th:value="${keyword}" class="campo-busqueda"/>

        <button type="submit" class="btn-control">Filtrar</button>
    </form>

    <div class="empleados-list">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Empleado</th>
                <th>Cesantías</th>
                <th>Intereses</th>
                <th>Prima</th>
                <th>Vacaciones</th>
                <th>Total Prestaciones</th>
                <th>Inicio</th>
                <th>Fin</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prestaciones}">
                <td th:text="${p.idPrestacion}">1</td>
                <td th:text="${p.primerNombre + ' ' + p.segundoNombre + ' ' + p.primerApellido + ' ' + p.segundoApellido}">Empleado</td>
                <td th:text="${#numbers.formatDecimal(p.cesantias, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td th:text="${#numbers.formatDecimal(p.intereses, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td th:text="${#numbers.formatDecimal(p.prima, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td th:text="${#numbers.formatDecimal(p.vacaciones, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td th:text="${#numbers.formatDecimal(p.totalPrestaciones, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td th:text="${#temporals.format(p.fechaInicio, 'yyyy-MM-dd')}">2025-01-01</td>
                <td th:text="${#temporals.format(p.fechaFin, 'yyyy-MM-dd')}">2025-01-31</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
