<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>

<nav th:replace="~{navbar :: navbar}"></nav>

<main>
    <h2 class="titulo-reporte">Administración del Sistema</h2>


    <div class="cards configuracion-cards">
        <div class="card card-config">
            <h3>Gestión de Cargos</h3>
            <p>Administra los cargos disponibles.</p>
            <a th:href="@{/cargos}" class="btn-control2 ">Cargos</a>
        </div>

        <div class="card card-config">
            <h3>Gestión de Departamentos</h3>
            <p>Administra los departamentos disponibles.</p>
            <a th:href="@{/departamentos}" class="btn-control2">Departamentos</a>
        </div>

        <div class="card card-config">
            <h3>Gestión de Auditorías</h3>
            <p>Control de auditorías.</p>
            <a th:href="@{/auditoria-nomina}" class="btn-control2">Auditorías</a>
        </div>
    </div>

</main>



<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
