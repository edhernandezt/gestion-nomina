<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Cargos</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
    <script>
        function abrirModalCrear() {
            document.getElementById("modalCrear").style.display = "block";
        }

        function abrirModalEditar(id) {
            const card = document.getElementById("cargo-" + id);
            const modal = document.getElementById("modalEditar");

            if (!card || !modal) return;

            modal.querySelector("input[name='idCargo']").value = id;
            modal.querySelector("input[name='nombre']").value = card.querySelector(".nombre").textContent.trim();
            modal.style.display = "block";
        }

        function cerrarModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.style.display = "none";
        }
    </script>
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container-empleado">
    <h4 class="titulo-reporte">Gestión de Cargos</h4>

    <!-- Barra de búsqueda -->
    <div class="empleados-barra-controles" style="display: flex; gap: 10px;">
        <form th:action="@{/cargos/buscar}" method="get" style="display: flex; gap: 10px;">
            <input type="text" placeholder="Buscar por nombre de cargo" name="keyword" class="campo-busqueda"/>
            <button type="submit" class="btn-control">Buscar</button>
        </form>
    </div>

    <!-- Botón crear -->
    <div style="display: flex; justify-content: flex-end; margin-top: 20px; margin-bottom: 20px;">
        <button type="button" class="btn-control3" onclick="abrirModalCrear()">+ Crear Cargo</button>
    </div>

    <!-- Cards de cargos -->
    <div class="empleados-cards">
        <div class="empleado-card" th:each="c : ${cargos}" th:id="'cargo-' + ${c.idCargo}">
            <h3 class="nombre" th:text="${c.nombre}">Nombre del cargo</h3>
            <p><strong>ID:</strong> <span th:text="${c.idCargo}">1</span></p>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-ver" th:onclick="'abrirModalEditar(' + ${c.idCargo} + ')'">Editar</button>
                <a class="btn-ver" th:href="@{/cargos/eliminar/{id}(id=${c.idCargo})}" onclick="return confirm('¿Eliminar este cargo?')">Eliminar</a>
            </div>

        </div>
    </div>

    <!-- Modal CREAR -->
    <div id="modalCrear" class="modal">
        <div class="contenedor-formulario">
            <h2>Crear Cargo</h2>
            <form th:action="@{/cargos/crear}" method="post" th:object="${cargoDTO}" class="formulario-empleado">
                <div class="campo-formulario">
                    <label>Nombre del Cargo:</label>
                    <input type="text" th:field="*{nombre}" required />
                </div>
                <div class="botones-formulario">
                    <button class="btn-control" type="submit">Guardar</button>
                    <button type="button" class="boton-volver" onclick="cerrarModal('modalCrear')">← Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal EDITAR -->
    <div id="modalEditar" class="modal">
        <div class="contenedor-formulario">
            <h2>Editar Cargo</h2>
            <form th:action="@{/cargos/actualizar}" method="post" th:object="${cargoDTO}" class="formulario-empleado">
                <input type="hidden" th:field="*{idCargo}" />
                <div class="campo-formulario">
                    <label>Nombre del Cargo:</label>
                    <input type="text" th:field="*{nombre}" required />
                </div>
                <div class="botones-formulario">
                    <button class="btn-control" type="submit">Actualizar</button>
                    <button type="button" class="boton-volver" onclick="cerrarModal('modalEditar')">← Cancelar</button>
                </div>
            </form>
        </div>
    </div>

</main>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
