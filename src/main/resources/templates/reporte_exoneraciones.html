<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Exoneraciones Parafiscales</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container">
    <h2 class="titulo-reporte">Reporte de Exoneraciones Parafiscales</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="inicio">Inicio:</label>
        <input type="date" id="inicio" name="inicio" value="2025-01-01">

        <label for="fin">Fin:</label>
        <input type="date" id="fin" name="fin" value="2025-03-31">

        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Fecha Aplicación</th>
                <th>Aplica SENA</th>
                <th>Aplica ICBF</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Laura Gómez</td>
                <td>01/02/2025</td>
                <td>Sí</td>
                <td>No</td>
            </tr>
            <tr>
                <td>Carlos Pérez</td>
                <td>15/01/2025</td>
                <td>Sí</td>
                <td>Sí</td>
            </tr>
            <tr>
                <td>Diana Martínez</td>
                <td>10/03/2025</td>
                <td>No</td>
                <td>Sí</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
