<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deducciones</title>
</head>
<body>

<div class="container mt-4">
    <h2>Deducciones</h2>
    <form th:action="@{/deduccion/generar}" method="post" class="mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <label for="fechaInicioGen" class="form-label">Fecha Inicio:</label>
                <input type="date" id="fechaInicioGen" name="fechaInicio" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label for="fechaFinGen" class="form-label">Fecha Fin:</label>
                <input type="date" id="fechaFinGen" name="fechaFin" class="form-control" required>
            </div>
            <div class="col-md-3 align-self-end">
                <button type="submit" class="btn btn-success">Generar Deducciones</button>
            </div>
        </div>
    </form>

    <div th:if="${mensajeDeduccion}" class="alert alert-success" th:text="${mensajeDeduccion}"></div>
    <div th:if="${errorDeduccion}" class="alert alert-danger" th:text="${errorDeduccion}"></div>
</div>

</body>
</html>
