<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Incapacidades</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>
<main class="container">
    <h2 class="titulo-reporte">Reporte de Incapacidades</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="inicio">Inicio:</label>
        <input type="date" id="inicio" name="inicio">
        <label for="fin">Fin:</label>
        <input type="date" id="fin" name="fin">
        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>
    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Origen</th>
                <th>Entidad Responsable</th>
            </tr>
            </thead>
            <tbody>
            <tr><td>Laura Gómez</td><td>10/03/2025</td><td>12/03/2025</td><td>Común</td><td>EPS</td></tr>
            <tr><td>Carlos Pérez</td><td>05/03/2025</td><td>07/03/2025</td><td>Laboral</td><td>ARL</td></tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
