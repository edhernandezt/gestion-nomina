<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Empleados Activos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container">
    <h2 class="titulo-reporte">Reporte de Empleados Activos</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="departamento">Departamento:</label>
        <select id="departamento" name="departamento">
            <option>Todos</option>
            <option>Finanzas</option>
            <option>Recursos Humanos</option>
            <option>IT</option>
        </select>

        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Departamento</th>
                <th>Cargo</th>
                <th>Fecha Ingreso</th>
                <th>Salario Básico</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Laura Gómez</td>
                <td>Finanzas</td>
                <td>Contadora</td>
                <td>10/01/2023</td>
                <td>$3.000.000</td>
            </tr>
            <tr>
                <td>Carlos Pérez</td>
                <td>IT</td>
                <td>Analista</td>
                <td>15/03/2022</td>
                <td>$2.800.000</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
