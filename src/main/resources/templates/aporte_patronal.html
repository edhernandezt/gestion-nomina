<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aportes Patronales</title>
</head>
<body>

<div class="container mt-4">
    <h2>Aportes Patronales</h2>

    <!-- Formulario para generar aportes -->
    <form th:action="@{/aporte-patronal/generar}" method="post" class="mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <label for="fechaInicioGen" class="form-label">Fecha Inicio:</label>
                <input type="date" id="fechaInicioGen" name="fechaInicio" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label for="fechaFinGen" class="form-label">Fecha Fin:</label>
                <input type="date" id="fechaFinGen" name="fechaFin" class="form-control" required>
            </div>
            <div class="col-md-3 align-self-end">
                <button type="submit" class="btn btn-success">Generar Aportes</button>
            </div>
        </div>
    </form>

    <!-- Mensajes de éxito o error -->
    <div th:if="${mensajeAporte}" class="alert alert-success" th:text="${mensajeAporte}"></div>
    <div th:if="${errorAporte}" class="alert alert-danger" th:text="${errorAporte}"></div>

</div>

</body>
</html>
