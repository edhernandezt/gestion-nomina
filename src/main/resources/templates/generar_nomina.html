<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generar Nómina</title>
</head>
<body>

<div class="container mt-4">
    <h2>Generar Nómina Mensual</h2>

    <!-- Formulario para generar nómina -->
    <form th:action="@{/nomina-mensual/generar}" method="post" class="mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <label for="fechaInicioGen" class="form-label">Fecha Inicio:</label>
                <input type="date" id="fechaInicioGen" name="fechaInicio" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label for="fechaFinGen" class="form-label">Fecha Fin:</label>
                <input type="date" id="fechaFinGen" name="fechaFin" class="form-control" required>
            </div>
            <div class="col-md-3 align-self-end">
                <button type="submit" class="btn btn-success">Generar Nómina</button>
            </div>
        </div>
    </form>

    <!-- Mensajes -->
    <div th:if="${mensajeNomina}" class="alert alert-success" th:text="${mensajeNomina}"></div>
    <div th:if="${errorNomina}" class="alert alert-danger" th:text="${errorNomina}"></div>

</div>

</body>
</html>
