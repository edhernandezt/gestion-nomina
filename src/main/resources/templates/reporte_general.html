<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Nómina</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>
<main class="container">
    <h2 class="titulo-reporte">Reporte General de Nómina</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="inicio">Inicio:</label>
        <input type="date" id="inicio" name="inicio">
        <label for="fin">Fin:</label>
        <input type="date" id="fin" name="fin">
        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>
    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Período</th>
                <th>Total Devengado</th>
                <th>Total Deducciones</th>
                <th>Neto Pagado</th>
            </tr>
            </thead>
            <tbody>
            <tr><td>Laura Gómez</td><td>01/03/2025 - 31/03/2025</td><td>$3.000.000</td><td>$450.000</td><td>$2.550.000</td></tr>
            <tr><td>Carlos Pérez</td><td>01/03/2025 - 31/03/2025</td><td>$2.500.000</td><td>$375.000</td><td>$2.125.000</td></tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
