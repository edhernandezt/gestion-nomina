<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prestaciones Sociales</title>
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4">Prestaciones Sociales</h2>

    <!-- Formulario para generar prestaciones -->
    <form th:action="@{/prestaciones/generar}" method="post" class="row g-3 mb-4">
        <div class="col-md-3">
            <label for="fechaInicio" class="form-label">Fecha Inicio:</label>
            <input type="date" id="fechaInicio" name="fechaInicio" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label for="fechaFin" class="form-label">Fecha Fin:</label>
            <input type="date" id="fechaFin" name="fechaFin" class="form-control" required>
        </div>
        <div class="col-md-3 align-self-end">
            <button type="submit" class="btn btn-primary">Generar Prestaciones</button>
        </div>
    </form>

    <!-- Mensajes de éxito o error -->
    <div th:if="${mensajePrestacion}" class="alert alert-success" th:text="${mensajePrestacion}"></div>
    <div th:if="${errorPrestacion}" class="alert alert-danger" th:text="${errorPrestacion}"></div>

</div>

</body>
</html>
