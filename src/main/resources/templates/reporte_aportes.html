<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Aportes</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container">
    <h2 class="titulo-reporte">Reporte de Aportes por Período</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="inicio">Inicio:</label>
        <input type="date" id="inicio" name="inicio" value="2025-03-01">
        <label for="fin">Fin:</label>
        <input type="date" id="fin" name="fin" value="2025-03-31">
        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Tipo de Aporte</th>
                <th>Periodo</th>
                <th>Valor</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Laura Gómez</td>
                <td>Salud</td>
                <td>03/2025</td>
                <td>$180.000</td>
            </tr>
            <tr>
                <td>Carlos Pérez</td>
                <td>Pensión</td>
                <td>03/2025</td>
                <td>$200.000</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
