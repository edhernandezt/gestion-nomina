<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial Salarial</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container">
    <h2 class="titulo-reporte">Historial Salarial por Empleado</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="empleado">Empleado:</label>
        <select id="empleado" name="empleado">
            <option>Todos</option>
            <option>Laura Gómez</option>
            <option>Carlos Pérez</option>
        </select>

        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Salario</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Laura Gómez</td>
                <td>01/01/2022</td>
                <td>31/12/2022</td>
                <td>$2.800.000</td>
            </tr>
            <tr>
                <td>Laura Gómez</td>
                <td>01/01/2023</td>
                <td>Actual</td>
                <td>$3.000.000</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
