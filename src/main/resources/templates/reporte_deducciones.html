<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Deducciones</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container">
    <h2 class="titulo-reporte">Reporte de Deducciones Personalizadas</h2>

    <div class="contenedor-volver">
        <a th:href="@{/reportes}" class="boton-volver">← Volver a Reportes</a>
    </div>

    <form class="form-filtro">
        <label for="inicio">Inicio:</label>
        <input type="date" id="inicio" name="inicio" value="2025-03-01">
        <label for="fin">Fin:</label>
        <input type="date" id="fin" name="fin" value="2025-03-31">
        <button type="submit">Filtrar</button>
        <button type="button">Exportar a PDF</button>
    </form>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Descripción</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Desde</th>
                <th>Hasta</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Laura Gómez</td>
                <td>Préstamo Empresa</td>
                <td>Descuento Mensual</td>
                <td>$200.000</td>
                <td>01/02/2025</td>
                <td>01/07/2025</td>
            </tr>
            <tr>
                <td>Diana Martínez</td>
                <td>Cuota Medicina Prepaga</td>
                <td>Otro</td>
                <td>$150.000</td>
                <td>01/03/2025</td>
                <td>31/12/2025</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
