<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Departamentos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script>
        function abrirModalCrear() {
            document.getElementById("modalCrear").style.display = "block";
        }

        function abrirModalEditar(id) {
            const card = document.getElementById("departamento-" + id);
            const modal = document.getElementById("modalEditar");

            if (!card || !modal) return;

            modal.querySelector("input[name='idDepartamento']").value = id;
            modal.querySelector("input[name='nombre']").value = card.querySelector(".nombre").textContent.trim();
            modal.style.display = "block";
        }

        function cerrarModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.style.display = "none";
        }
    </script>
</head>
<body>
<header th:replace="~{header :: header}"></header>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container-empleado">
    <h4 class="titulo-reporte">Gestión de Departamentos</h4>

    <div style="margin: 20px 0;">
        <a th:href="@{/configuracion}" class="boton-volver">← Volver a Configuración</a>
    </div>


    <!-- Barra de búsqueda -->
    <div class="empleados-barra-controles" style="display: flex; gap: 10px;">
        <form th:action="@{/departamentos/buscar}" method="get" style="display: flex; gap: 10px;">
            <input type="text" placeholder="Buscar por nombre de departamento" name="keyword" class="campo-busqueda"/>
            <button type="submit" class="btn-control">Buscar</button>
        </form>
    </div>

    <!-- Botón crear -->
    <div style="display: flex; justify-content: flex-end; margin-top: 20px; margin-bottom: 20px;">
        <button type="button" class="btn-control3" onclick="abrirModalCrear()">+ Crear Departamento</button>
    </div>

    <!-- Cards -->
    <div class="empleados-cards">
        <div class="empleado-card" th:each="dep : ${departamentos}" th:id="'departamento-' + ${dep.idDepartamento}">
            <h3 class="nombre" th:text="${dep.nombre}">Nombre del departamento</h3>
            <p><strong>ID:</strong> <span th:text="${dep.idDepartamento}"></span></p>

            <div style="display: flex; gap: 10px; margin-top: 20px; ">
            <button class="btn-ver" th:onclick="'abrirModalEditar(' + ${dep.idDepartamento} + ')'">Editar</button>
            <a class="btn-ver" th:href="@{/departamentos/eliminar/{id}(id=${dep.idDepartamento})}" onclick="return confirm('¿Eliminar este departamento?')">Eliminar</a>
            </div>
        </div>
    </div>

    <!-- Modal CREAR -->
    <div id="modalCrear" class="modal">
        <div class="contenedor-formulario">
            <h2>Crear Departamento</h2>
            <form th:action="@{/departamentos/crear}" method="post" th:object="${departamentoDTO}" class="formulario-empleado">
                <div class="campo-formulario">
                    <label>Nombre del Departamento:</label>
                    <input type="text" th:field="*{nombre}" required />
                </div>
                <div class="botones-formulario">
                    <button class="btn-control" type="submit">Guardar</button>
                    <button type="button" class="boton-volver" onclick="cerrarModal('modalCrear')">← Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal EDITAR -->
    <div id="modalEditar" class="modal">
        <div class="contenedor-formulario">
            <h2>Editar Departamento</h2>
            <form th:action="@{/departamentos/actualizar}" method="post" th:object="${departamentoDTO}" class="formulario-empleado">
                <input type="hidden" th:field="*{idDepartamento}" />
                <div class="campo-formulario">
                    <label>Nombre del Departamento:</label>
                    <input type="text" th:field="*{nombre}" required />
                </div>
                <div class="botones-formulario">
                    <button class="btn-control" type="submit">Actualizar</button>
                    <button type="button" class="boton-volver" onclick="cerrarModal('modalEditar')">← Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
